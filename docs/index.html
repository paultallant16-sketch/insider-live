<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insider Live</title>
<meta name="description" content="Live buy signals from proven insider wallet teams on fresh memecoin launches.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0d0f12;--panel:#15181d;--panel2:#1b1f26;--line:#262b33;--text:#e8eaed;--muted:#8b93a1;--faint:#5b6370;
--green:#3ecf8e;--amber:#f2b84b;--red:#f0616d;--blue:#6aa8ff;--violet:#a98bff;--chip:#20252d;--hot:#ff7a45}
@media (prefers-color-scheme:light){:root{color-scheme:light;--bg:#f6f7f9;--panel:#fff;--panel2:#f1f3f6;--line:#e3e6eb;--text:#14171c;--muted:#5d6573;--faint:#7d8592;--chip:#eef0f4;--green:#14a06a;--amber:#b7790f;--red:#d23b4a;--blue:#2f6fdc;--violet:#6e4fe0;--hot:#e0561c}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
body{overflow-x:hidden}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}.sub{color:var(--muted);margin-top:4px;max-width:720px}
h2{font-size:16px;margin:18px 0 4px}.lead{color:var(--muted);margin:0 0 12px;max-width:820px}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;animation:p 2s infinite}
.pulse.stale{background:var(--amber);animation:none}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(62,207,142,.6)}70%{box-shadow:0 0 0 8px rgba(62,207,142,0)}100%{box-shadow:0 0 0 0 rgba(62,207,142,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.stamp{color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kpi b{display:block;font-size:22px;font-weight:600;margin-top:2px}.kpi>span{color:var(--muted);font-size:12px}.kpi small{display:block;color:var(--faint);font-size:11px;margin-top:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tabs button,.chips button,.seg button{background:var(--chip);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:inherit;cursor:pointer;white-space:nowrap}
.tabs button.on,.chips button.on,.seg button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.tabs button.sigtab{font-weight:600}
input.q{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit;min-width:0;flex:1 1 160px;max-width:300px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--panel2);position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:0}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td,.feed li,.tok{overflow-wrap:anywhere}
.mono{font-family:"JetBrains Mono",monospace;font-size:12px}.muted{color:var(--muted)}.faint{color:var(--faint)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.g-Elite{color:var(--violet);border-color:var(--violet)}.g-Strong{color:var(--blue);border-color:var(--blue)}.g-Decent{color:var(--amber)}.g-Tested{color:var(--green);border-color:var(--green)}
.buy{color:var(--green)}.sell{color:var(--red)}
.st-live{color:var(--green);border-color:var(--green)}.st-active{color:var(--green)}.st-recent{color:var(--amber)}.st-quiet,.st-dormant{color:var(--faint)}
.chain{font-size:11px;color:var(--muted)}
.scroll{max-height:72vh;overflow:auto}
.empty{padding:28px;text-align:center;color:var(--muted)}
.empty b{color:var(--text)}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--muted);margin-top:14px}
.note b{color:var(--text)}.note p{margin:6px 0}.note a{color:var(--blue)}
details summary{cursor:pointer}.wl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.up{color:var(--green)}.down{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:12px}
.tok{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tok.fire{border-color:var(--hot);box-shadow:0 0 0 1px color-mix(in srgb,var(--hot) 35%,transparent)}
.tok .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tok .top>div:first-child{min-width:0}
.tok .sym{font-size:18px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.heat{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.heat.h3{background:var(--hot);color:#fff}.heat.h2{color:var(--hot);border:1px solid var(--hot)}
.tok .what{font-size:14px}.tok .what b{font-weight:600}
.tok .when{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.stats div{background:var(--panel2);border-radius:8px;padding:6px 8px;min-width:0}.stats>div>span{display:block;font-size:11px;color:var(--muted)}.stats b{font-size:14px;font-variant-numeric:tabular-nums}
.teams{display:flex;flex-wrap:wrap;gap:5px}
.links{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--blue);margin-top:auto}
.feed{list-style:none;margin:0;padding:0}.feed li{display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:baseline}
.feed li>span:last-child{min-width:0}
.feed li:last-child{border-bottom:0}.feed .t{color:var(--muted);font-size:12px;min-width:62px;white-space:nowrap}
.feed li.empty{display:block}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.dot.buy{background:var(--green)}.dot.sell{background:var(--red)}
.summary{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.summary .kpi{flex:1;min-width:140px}
.meter{height:8px;border-radius:99px;background:var(--red);overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:var(--green)}.meter.none{background:var(--chip)}
.ntfy{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--blue);border-radius:12px;padding:12px 14px;margin:10px 0}
.ntfy b{color:var(--text)}.ntfy .mono{font-size:12px;overflow-wrap:anywhere}
.ntfy a.btn{background:var(--blue);color:#fff;border-radius:999px;padding:6px 14px;font-weight:600;white-space:nowrap}
.hint{color:var(--faint);font-size:12px;margin:6px 0 0}
@media (max-width:700px){.hide-m{display:none}.kpi b{font-size:18px}.stats{grid-template-columns:1fr 1fr}th,td{padding:8px 8px}.feed li{gap:8px;padding:10px 10px}.feed .t{min-width:52px}input.q{max-width:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Insider Live</h1>
    <div class="sub">What the insider teams we found are buying right now on Solana, Robinhood Chain, BSC, Base and Ethereum, and how those buys have done since. A team buying is a lead to look at, not a reason to buy.</div>
  </div>
  <div class="stamp"><span class="pulse" id="pulse"></span><span id="stamp">Loading…</span></div>
</header>

<div class="kpis" id="kpis"></div>

<div class="tabs" id="tabs">
  <button data-v="signals" class="sigtab on">Buy signals</button>
  <button data-v="hot">Hot now</button>
  <button data-v="best">Best last 7 days</button>
  <button data-v="feed">Live feed</button>
  <button data-v="teams">Teams</button>
  <button data-v="kols">KOLs</button>
  <button data-v="alerts">Alerts</button>
  <button data-v="new">Past $500K</button>
  <button data-v="how">How to read this</button>
</div>
<div class="bar">
  <div class="chips" id="chips"></div>
  <input class="q" id="q" type="search" placeholder="Search token, team or wallet" aria-label="Search token, team or wallet">
</div>
<div id="view"></div>
</div>

<script>
'use strict';
const CH=['All','Solana','Robinhood','BSC','Base','Ethereum'];
const GM={Solana:'sol',Robinhood:'robinhood',BSC:'bsc',Base:'base',Ethereum:'eth'};
const DS={Solana:'solana',Robinhood:'robinhood',BSC:'bsc',Base:'base',Ethereum:'ethereum'};
const VIEWS=['signals','hot','best','feed','teams','kols','alerts','new','how'];
const NTFY_TOPIC='insider-live-49ab55a62a52',NTFY_URL='https://ntfy.sh/'+NTFY_TOPIC;
const PROVEN_GRADES=new Set(['Elite','Strong','Tested']);
const AGE_MAX=72,FEED_MIN=100,HOT_MIN=200;

let D={moves:[],groups:[],alerts:[],disc:[],hot:[],sig:null,meta:{}},GMAP={};
let view='signals',chain='All',q='',bestMode='best',age='fresh',fading=false,sigFading=false,feedAll=false,hotSmall=false,newAll=false,showRisky=false;
let lastLoad=0,loading=false;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>Array.isArray(v)?v:[];
const str=v=>v==null?'':String(v);
const num=v=>{if(v==null||v===''||typeof v==='boolean')return null;const n=Number(v);return Number.isFinite(n)?n:null};
const cnt=v=>{const n=num(v);return n==null?0:Math.max(0,Math.round(n))};
const now=()=>Date.now()/1000;
const plural=(n,w)=>n+' '+w+(n===1?'':'s');

function dur(s){s=num(s);if(s==null||s<0)return'';if(s<60)return Math.round(s)+'s';if(s<3600)return Math.floor(s/60)+'m';if(s<86400){const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h+'h'+(m&&h<6?' '+m+'m':'')}return Math.floor(s/86400)+'d'}
function ago(t){t=num(t);if(!t)return'—';const s=now()-t;if(s<60)return'just now';return dur(s)+' ago'}
function usd(v){v=num(v);if(v==null)return'—';const a=Math.abs(v),sg=v<0?'-':'';if(a>=1e9)return sg+'$'+(a/1e9).toFixed(2)+'B';if(a>=1e6)return sg+'$'+(a/1e6).toFixed(a>=1e7?1:2)+'M';if(a>=1e3)return sg+'$'+(a/1e3).toFixed(a>=1e4?0:1)+'K';return sg+'$'+a.toFixed(a>=1||a===0?0:2)}
const mc=v=>num(v)>0?usd(v):'—';
function pctTxt(c){const p=c*100;return(p>0?'+':'')+(Math.abs(p)>=1000?Math.round(p).toLocaleString('en-US'):p.toFixed(Math.abs(p)<10?1:0))+'%'}
function pct(c){c=num(c);if(c==null)return'<span class="faint">—</span>';const p=c*100;return`<span class="${p>0.5?'up':p<-0.5?'down':'muted'}">${pctTxt(c)}</span>`}
const short=a=>{a=str(a);return esc(a.length>12?a.slice(0,4)+'…'+a.slice(-4):a)};
const net=(m,c)=>m[c]||encodeURIComponent(str(c).toLowerCase());
const gmgn=(c,ca)=>esc(`https://gmgn.ai/${net(GM,c)}/token/${encodeURIComponent(str(ca))}`);
const dex=(c,ca)=>esc(`https://dexscreener.com/${net(DS,c)}/${encodeURIComponent(str(ca))}`);
const symOf=r=>esc(str(r.sym).trim()||'?');
function tokLink(r){return r.ca?`<a href="${gmgn(r.chain,r.ca)}" target="_blank" rel="noopener"><b>${symOf(r)}</b></a>`:`<b>${symOf(r)}</b>`}
function links(r,extra=''){return`<div class="links">${r.ca?`<a href="${gmgn(r.chain,r.ca)}" target="_blank" rel="noopener">GMGN</a><a href="${dex(r.chain,r.ca)}" target="_blank" rel="noopener">DexScreener</a>`:''}${extra}</div>`}
const median=a=>{const s=a.filter(x=>x!=null).sort((x,y)=>x-y),n=s.length;if(!n)return null;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2};

const grp=id=>GMAP[id];
const isProven=id=>{const g=GMAP[id];return!!g&&!g.flag&&(PROVEN_GRADES.has(g.grade)||cnt(g.legit)>0)};
function gname(id,full){const g=grp(id);if(!g)return str(id);return str(full?(g.label||g.nick||g.name):(g.nick||g.name||id))}
function teamChip(id){const g=grp(id);if(!g)return`<span class="tag">${esc(id||'?')}</span>`;const L=cnt(g.legit);
  const tip=[g.style,g.grade,cnt(g.winners)+' wins / '+cnt(g.failed)+' misses',L?'early on '+L+' lasting token'+(L===1?'':'s'):''].filter(Boolean).join(' · ');
  return`<span class="tag ${g.flag?'down':'g-'+esc(g.grade)}" title="${esc(g.flag?'⚠ '+g.flag+': '+(g.flag_reason||''):tip)}">${g.flag?'⚠ ':L?'★ ':''}${esc(g.nick||g.name||id)}</span>`}
function chips(ids,max=4){ids=arr(ids);return ids.slice(0,max).map(teamChip).join('')+(ids.length>max?`<span class="tag">+${ids.length-max}</span>`:'')}

async function j(f){try{const r=await fetch('data/'+f+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return null;const x=await r.json();return x&&typeof x==='object'?x:null}catch(e){return null}}
const rowsOf=x=>arr(x&&x.rows).filter(r=>r&&typeof r==='object');
async function load(){
  if(loading)return;loading=true;
  try{
    const [m,g,a,d,h,meta,s,k,sc]=await Promise.all(['moves.json','groups.json','alerts.json','discovery.json','hot.json','meta.json','signals.json','kols.json','scorecard.json'].map(j));
    D={moves:rowsOf(m).sort((x,y)=>(num(y.ts)||0)-(num(x.ts)||0)),groups:rowsOf(g),kols:rowsOf(k),card:(sc&&sc.chains)||{},alerts:rowsOf(a),disc:rowsOf(d),hot:h?rowsOf(h):null,sig:s?rowsOf(s):null,meta:meta||{}};
    GMAP=Object.fromEntries(D.groups.filter(x=>x.id!=null).map(x=>[x.id,x]));
    if(!D.hot)D.hot=buildHot();
    lastLoad=Date.now();
    stamp();kpis();render(true);
  }finally{loading=false}
}
function stamp(){
  const up=num(D.meta.updated);const stale=!up||now()-up>3600;
  $('#pulse').className='pulse'+(stale?' stale':'');
  $('#stamp').textContent=!up?'Waiting for the first scan':stale?`Last scan ${ago(up)} · the scanner may be paused`:`Scanned ${ago(up)} · page refreshes every 2 min`;
}
function buildHot(){// fallback if the scanner has not written hot.json yet
  const since=now()-3*86400,t6=now()-6*3600,H={};
  [...D.moves].sort((a,b)=>(num(a.ts)||0)-(num(b.ts)||0)).forEach(m=>{const ts=num(m.ts)||0;if(m.side==='internal'||ts<since||!m.ca)return;const k=m.chain+'|'+m.ca;
    const h=H[k]||(H[k]={chain:m.chain,ca:m.ca,sym:m.sym,first_buy:null,mc_first:null,mc_now:num(m.mc),buy_usd:0,sell_usd:0,buys:0,sells:0,w:new Set(),g:new Set(),last_buy:0,buys_6h:0,usd_6h:0,g6:new Set()});
    h.mc_now=num(m.mc)||h.mc_now;
    if(m.side==='buy'){if(!h.first_buy){h.first_buy=ts;h.mc_first=num(m.mc)}h.last_buy=Math.max(h.last_buy,ts);h.buys++;h.buy_usd+=num(m.usd)||0;h.w.add(m.wallet);arr(m.groups).forEach(x=>h.g.add(x));
      if(ts>=t6){h.buys_6h++;h.usd_6h+=num(m.usd)||0;arr(m.groups).forEach(x=>h.g6.add(x))}}else{h.sells++;h.sell_usd+=num(m.usd)||0}});
  return Object.values(H).filter(h=>h.first_buy).map(({w,g,g6,...h})=>({...h,n_wallets:w.size,n_groups:g.size,groups:[...g],groups_6h:[...g6],change:h.mc_first&&h.mc_now?h.mc_now/h.mc_first-1:null}));
}
const inChain=r=>chain==='All'||r.chain===chain;
function match(r,extra=''){if(!q)return true;const ids=arr(r.groups).concat(arr(r.teams),arr(r.groups_6h));
  const s=[r.sym,r.ca,ids.map(x=>gname(x,true)+' '+gname(x)).join(' '),extra].map(str).join(' ').toLowerCase();return s.includes(q)}
function ageTxt(h){const a=num(h.age_h);return a==null?'age ?':ageFmt(a)+' old'}
function ageFmt(a){return a<1?Math.max(1,Math.round(a*60))+'m':a<48?Math.round(a)+'h':Math.round(a/24)+'d'}
function freshOK(h){if(!fading&&h.state==='fading')return false;if(age==='fresh'){const a=num(h.age_h);return a!=null&&a<=AGE_MAX}return true}
function stateTag(h){const a=num(h.age_h);const m={fresh:['Fresh','up'],running:['Running','up'],fading:['Fading','down'],older:a!=null&&a<=72?['Young','muted']:['Older','faint']}[h.state];return m?`<span class="tag ${m[1]}">${m[0]}</span>`:''}
function safeOK(x){return showRisky||!x||x.tradable!==false}
function riskyKeys(){const k=new Set();[D.hot,D.alerts,D.disc,arr(D.sig)].forEach(l=>arr(l).forEach(x=>{if(x&&x.tradable===false)k.add(str(x.chain)+'|'+str(x.ca))}));return k}
function riskTag(x){return x&&x.tradable===false?`<span class="tag down" title="${esc(arr(x.risk).join(', '))}">⚠ ${esc(arr(x.risk)[0]||'not tradable')}</span>`:''}
function riskBar(n){return`<div class="bar seg"><button data-r="1" class="${showRisky?'on':''}">${showRisky?'Showing':'Hiding'} scam / untradable tokens${n?' ('+n+')':''}</button></div>`}
function freshBar(){return`<div class="bar seg"><button data-a="fresh" class="${age==='fresh'?'on':''}">Fresh only (under 3 days)</button><button data-a="all" class="${age==='all'?'on':''}">Any age</button><button data-x="1" class="${fading?'on':''}">${fading?'Showing':'Hiding'} fading tokens</button></div>`}
const GW={Elite:3,Strong:2,Tested:2,Decent:1,Unproven:.5};const LW=g=>Math.min(cnt(g&&g.legit),3);
const g6=h=>Array.isArray(h.groups_6h)?h.groups_6h:arr(h.groups);
function teamScore(h){return g6(h).reduce((s,id)=>{const g=grp(id);return s+(GW[g&&g.grade]??.5)+LW(g)},0)}
function heat(h){return teamScore(h)*3+Math.min(cnt(h.n_wallets),6)+Math.log10(1+Math.max(0,num(h.usd_6h)||0))}
const provenIn=ids=>arr(ids).filter(isProven).length;
function hotLegit(h){const p=provenIn(g6(h));return(p>=1&&(num(h.usd_6h)||0)>=HOT_MIN)||p>=2}
const feedLegit=m=>arr(m.groups).some(isProven)&&(num(m.usd)||0)>=FEED_MIN;
const sigs=()=>arr(D.sig);
function sigChange(s){const c=num(s.change);if(c!=null)return c;const a=num(s.mc_at_signal),b=num(s.mc_now);return a>0&&b!=null?b/a-1:null}
function sigPeak(s){let c=num(s.peak_change);if(c==null){const a=num(s.mc_at_signal),p=num(s.peak_mc);c=a>0&&p!=null?p/a-1:null}const n=sigChange(s);return c==null?n:n==null?c:Math.max(c,n)}

function kpis(){
  const t6=now()-6*3600,t24=now()-86400;
  const s24=sigs().filter(s=>inChain(s)&&(num(s.first_signal)||0)>=t24);
  const b6=D.moves.filter(m=>m.side==='buy'&&(num(m.ts)||0)>=t6&&inChain(m)&&feedLegit(m));
  const act=new Set();D.moves.forEach(m=>{if((num(m.ts)||0)>=t24&&m.side==='buy'&&inChain(m))arr(m.groups).forEach(g=>act.add(g))});
  const b3=D.hot.filter(h=>inChain(h)&&num(h.change)!=null);const upN=b3.filter(h=>num(h.change)>0).length;
  $('#kpis').innerHTML=[
    ['Buy signals in last 24h',D.sig?s24.length:'—',D.sig?'proven teams, real money, fresh tokens':'waiting for the scanner'],
    ['Proven-team buys in last 6h',b6.length+' · '+usd(b6.reduce((s,m)=>s+(num(m.usd)||0),0)),'$'+FEED_MIN+'+ buys only'],
    ['Teams buying in last 24h',act.size+' of '+D.groups.filter(g=>g.kind!=='kol'&&inChain(g)).length,''],

  const cnts={};all.forEach(r=>cnts[r.grade]=(cnts[r.grade]||0)+1);
  const rows=all.filter(r=>kolG==='all'||r.grade===kolG);
  const t6=now()-6*3600;
  const now6=[];all.filter(r=>r.grade==='Follow'||r.grade==='Watch').forEach(r=>arr(r.recent).forEach(b=>{if((num(b.ts)||0)>=t6)now6.push({...b,kol:r})}));
  now6.sort((a,b)=>(num(b.ts)||0)-(num(a.ts)||0));
  const R=(x,k)=>num((x||{})[k]);
  $('#view').innerHTML=`<p class="lead"><b>Should you follow this KOL?</b> For each KOL we took their last 30 days of buys and simulated copying each one 5 minutes later, then selling 1 minute after they sold (or after 6 hours). We also checked whether wallets sell into their buyers the moment they buy, which is the Cupsey pattern. Since they started being tracked live, every buy is also re-checked 1 hour and 6 hours later, so grades can move. The numbers shown include no fees or slippage; grades subtract 3% per trade for them. Real results will be worse. Not financial advice.</p>
  <div class="bar seg">${['all',...KOL_ORDER].map(g=>`<button data-k="${esc(g)}" class="${kolG===g?'on':''}">${g==='all'?'All':esc(g)} (${g==='all'?all.length:(cnts[g]||0)})</button>`).join('')}</div>
  ${now6.length?`<div class="card" style="margin-bottom:12px;padding:10px 12px"><b>Bought in the last 6h by KOLs graded Follow or Watch</b><div style="margin-top:6px">${now6.slice(0,12).map(b=>`<div style="padding:3px 0">${tokLink({chain:b.kol.chain,ca:b.ca,sym:b.sym})} ${riskTag(b)} <span class="muted">by ${esc(b.kol.name)} · ${usd(b.usd)} at ${usd(b.mc)} mcap · ${ago(b.ts)}${num(b.mc_now)&&num(b.mc)?' · now '+pct(num(b.mc_now)/num(b.mc)-1):''}</span></div>`).join('')}</div></div>`:''}
  <div class="card scroll"><table><thead><tr><th>KOL</th><th>Grade</th><th class="n">Copy result (30d)</th><th class="n hide-m">Win rate</th><th class="n hide-m">Out before you</th><th class="n hide-m">Live 1h after buy</th><th class="hide-m">Last buy</th></tr></thead><tbody>
  ${rows.map(r=>{const x=r.research||{},L=r.live||{};return`<tr><td><details data-id="${esc(r.id)}"><summary><b>${esc(r.name)}</b>${r.twitter?` <a class="muted" href="https://x.com/${encodeURIComponent(str(r.twitter))}" target="_blank" rel="noopener">@${esc(r.twitter)}</a>`:''}<div class="chain">${esc(r.chain)} · ${plural(arr(r.wallets).length,'wallet')}${cnt(r.buys_3d)?' · '+cnt(r.buys_3d)+' buys in 3d':''}</div></summary>
    <div style="margin-top:6px;font-size:13px">${arr(r.why).map(w=>`<div>• ${esc(w)}</div>`).join('')}</div>
    <div class="faint" style="font-size:12px;margin-top:6px">Research: ${cnt(x.n)} buys tested · copy 1 min late ${pct(R(x,'copy1_mean'))} avg · 5 min late ${pct(R(x,'copy5_mean'))} avg, ${pct(R(x,'copy5_median'))} median · held 1h ${pct(R(x,'h1_median'))} median · 2x+ peak on ${R(x,'share_2x')!=null?Math.round(R(x,'share_2x')*100)+'%':'—'} · they hold ${R(x,'hold_min')!=null?ageFmt(R(x,'hold_min')/60):'—'} (median) · their 30d PnL ${usd(R(x,'pnl_30d'))}${x.ring?` · ring check: ${esc(x.ring)}`:''}</div>
    ${arr(r.recent).length?`<div style="margin-top:6px">${arr(r.recent).map(b=>`<div style="font-size:12px">${tokLink({chain:r.chain,ca:b.ca,sym:b.sym})} ${riskTag(b)} <span class="muted">${usd(b.usd)} at ${usd(b.mc)} · ${ago(b.ts)}${num(b.mc_now)&&num(b.mc)?' · now '+pct(num(b.mc_now)/num(b.mc)-1):''}</span></div>`).join('')}</div>`:''}
    <div class="faint" style="font-size:11px;margin-top:4px;word-break:break-all">${arr(r.wallets).map(esc).join(' · ')}</div></details></td>
    <td>${kolTag(r.grade)}</td><td class="n">${pct(R(x,'copy5_mean'))}<div class="chain">${cnt(x.n)?cnt(x.n)+' buys':''}</div></td>
    <td class="n hide-m">${R(x,'win')!=null?Math.round(R(x,'win')*100)+'%':'—'}</td>
    <td class="n hide-m">${R(x,'sold_first')!=null?Math.round(R(x,'sold_first')*100)+'%':'—'}</td>
    <td class="n hide-m">${L.n1?pct(L.med1)+`<div class="chain">${cnt(L.n1)} buys</div>`:'<span class="faint">—</span>'}</td>
    <td class="hide-m">${ago(r.last_buy)}</td></tr>`}).join('')||(arr(D.kols).length?'<tr><td colspan="7" class="empty">No KOLs match.</td></tr>':'<tr><td colspan="7" class="empty">KOL grades are being researched and will appear here soon.</td></tr>')}
  </tbody></table></div>`;
}
const KOL_ORDER=['Follow','Watch','Not enough data',"Don't follow",'Exit liquidity','Avoid: dump ring'];
function teamVerdict(g){
  const c=g.copy,f=g.follow,p=g.peak;
  if(g.flag)return['down','Do not copy: caught dumping on followers'];
  if(p&&cnt(p.n)>=5){
    if(num(p.x2)>=0.25||num(p.med)>=0.5)return['up',`Good entries: after you could get in, ${Math.round(num(p.x2)*100)}% of their buys went 2x+`];
    if(num(p.med)<0.2)return['down','Their buys rarely run after you could get in'];
  }
  if(!c||cnt(c.n)<5)return['faint','Not enough recent buys to judge yet'];
  if(num(c.med)>=0&&num(c.mean)>=0)return['up','Copying their trades has paid lately'];
  if(f&&num(f.med)<=-0.3)return['down','They win by getting out fast; copying and holding loses'];
  return['muted','Mixed: copying them is roughly break-even'];
}
function teamRecord(g,L){
  const v=teamVerdict(g),c=g.copy,f=g.follow,best=arr(g.best).filter(b=>num(b.x)>=1.5);
  const line=(lab,x,tip)=>x&&cnt(x.n)?`<div title="${esc(tip)}"><span class="faint">${lab}</span> <b class="${num(x.med)>=0?'up':'down'}">${pct(num(x.med))}</b> <span class="faint">median · won ${Math.round(num(x.win)*100)}% of ${cnt(x.n)}</span></div>`:'';
  return`<div class="${v[0]}" style="font-weight:600;font-size:13px;margin-bottom:3px">${esc(v[1])}</div>
  <div style="font-size:12px"><span class="faint">Their record:</span> ${cnt(g.winners)} wins / ${cnt(g.failed)} misses${num(g.profit)>0?` · ${usd(g.profit)} profit`:''}${L?` · <span class="up">★ early on ${plural(L,'lasting token')}</span>`:''}</div>
  ${best.length?`<div style="font-size:12px"><span class="faint">Best hits (7d, from when you could get in):</span> ${best.map(b=>`${esc(b.sym)} <b class="up">${num(b.x).toFixed(1)}x</b>`).join(', ')}</div>`:''}
  ${g.peak&&cnt(g.peak.n)?`<div style="font-size:12px;margin-top:2px" title="From the market cap when we saw each first buy (when you could have got in) to the highest market cap after it. Best case: it assumes you sold at the top."><span class="faint">From when you could get in, peak after:</span> <b class="${num(g.peak.med)>=0.5?'up':num(g.peak.med)>=0.2?'':'down'}">${pct(num(g.peak.med))}</b> <span class="faint">median · 2x+ on ${Math.round(num(g.peak.x2)*100)}% · 1.5x+ on ${Math.round(num(g.peak.x15)*100)}% of ${cnt(g.peak.n)}</span></div>`:''}
  <div style="font-size:12px;margin-top:2px">${line('If you copied their trades:',c,'Buy when they buy, sell when they first sell (or hold if they still do). Last 7 days, at the market cap when each trade was seen.')}${line('If you bought and held:',f,'Buy when they buy and keep it until now. Last 7 days.')}</div>`;
}
function vNew(){
  const all0=D.disc.filter(r=>inChain(r)&&match(r)),all=all0.filter(safeOK),nRisk=all0.length-all.length;
  const rows=all.filter(r=>newAll||arr(r.first_buys).length).sort((x,y)=>(num(y.created)||0)-(num(x.created)||0));
  const bought=all.filter(r=>arr(r.first_buys).length),yes=bought.filter(r=>r.verdict==='yes').length,some=bought.filter(r=>r.verdict==='some').length,late=bought.filter(r=>r.verdict==='late').length;
  const V={yes:['Could have bought','up'],some:['Some room','muted'],late:['Too late','down'],unknown:['No price yet','faint'],none:['No team buy','faint']};
  const mcAt=(m,ts,c)=>m?`<b>${usd(m)}</b><div class="chain">${ts&&c?ageFmt(Math.max(0,ts-c)/3600)+' after launch':''}</div>`:'<span class="faint">—</span>';
  $('#view').innerHTML=`<p class="lead">Every token from the last 7 days that went past $500K market cap. For each one we check whether any of our team wallets bought it, at what market cap the <b>first team wallet</b> got in, what it was at when our scanner would have seen that buy (a few minutes later), and the best it reached after. That tells you honestly whether following the team could have made money.</p>
  <div class="summary">
    <div class="kpi"><span>Tokens past $500K (7d)</span><b>${all.length}</b></div>
    <div class="kpi"><span>Our teams were in</span><b>${bought.length}</b></div>
    <div class="kpi"><span>Could have bought (2x+ left)</span><b class="up">${yes}</b></div>
    <div class="kpi"><span>Some room / too late</span><b>${some} / ${late}</b></div>
  </div>
  ${riskBar(nRisk)}<div class="bar seg"><button data-n="bought" class="${newAll?'':'on'}">Only ones our teams bought</button><button data-n="all" class="${newAll?'on':''}">All ${all.length} tokens</button></div>
  <div class="card scroll"><table><thead><tr><th>Token</th><th class="n">MC now / best</th><th>First team buy</th><th class="n hide-m">When we'd have seen it</th><th>Verdict</th></tr></thead><tbody>
  ${rows.map(r=>{const c=num(r.created),fb=arr(r.first_buys),f=fb[0],v=V[r.verdict]||(fb.length?V.unknown:V.none);
    const pending=(r.chain!=='Solana'&&r.backfill_done===false)?'<div class="chain">still checking older blocks…</div>':'';
    return`<tr><td>${tokLink(r)} ${riskTag(r)}<div class="chain">${esc(r.chain||'?')} · ${c?ageFmt(Math.max(0,now()-c)/3600)+' old':'age ?'}</div></td>
    <td class="n">${usd(r.mc)}<div class="chain">best ${usd(Math.max(num(r.peak_after)||0,num(r.ath)||0)||null)}</div></td>
    <td>${f?`${mcAt(r.entry_mc,num(f.ts),c)}${r.entry_from==='buy'?'<div class="chain">priced from the team\'s own buy</div>':''}<div class="teams">${chips(r.groups,3)}</div><div class="chain">${plural(fb.length,'team wallet')}</div>`:'<span class="faint">none of our wallets</span>'}${pending}</td>
    <td class="n hide-m">${r.seen_mc?`${usd(r.seen_mc)}<div class="chain">${r.seen_from==='first candle'?'first price on the main pool':f&&f.seen?ageFmt(Math.max(0,(num(f.seen)||0)-(num(f.ts)||0))/3600)+' after the buy':'~7m after the buy'}</div>`:'<span class="faint">—</span>'}</td>
    <td><span class="tag ${v[1]}">${v[0]}</span>${num(r.room)?`<div class="chain">${num(r.room).toFixed(1)}x from where we'd see it to its best</div>`:''}</td></tr>`}).join('')||`<tr><td colspan="5" class="empty">${newAll?'No tokens past $500K yet.':'None of our teams bought a $500K+ token in the last 7 days yet. Older buys are being checked a few tokens per scan.'}</td></tr>`}
  </tbody></table></div>
  <p class="faint" style="margin-top:8px;font-size:12px">"Could have bought" = from the market cap at the moment our scanner would have seen the first team buy, the token later at least doubled. "Some room" = rose 30-100% more. "Too late" = under 30%. Robinhood, BSC, Base and Ethereum are checked from launch using the chain itself; Solana uses what our scanner saw live plus the token's latest trades, so very early Solana buys before the scanner started can be missed.</p>`;
}

/* ---------- How to read this ---------- */
function vHow(){
  $('#view').innerHTML=`<div class="note">
  <p><b>Buy signals (start here).</b> A signal fires only when <b>proven teams</b> (grade Elite, Strong or Tested, or ★) put <b>real money</b> into a <b>fresh token</b>: every buy counted is at least $50, and together they add up to $300+ from 2 or more wallets or teams, or there is one single buy of $500+. The token must be under 24 hours old, not already fading, and the teams must not be selling (their sells less than half their buys). Signals are rare on purpose. Each card shows how old the token was when flagged, how long ago it was flagged, market cap then and now, and the best it has done since.</p>
  <p><b>Scam filter.</b> Every token is checked before it can become a buy signal: at least $10K of real liquidity, market cap not more than 100x the liquidity, 100+ holders, the top 10 wallets holding no more than 75%, not a honeypot (you can sell), and on Solana the creator cannot mint more or freeze wallets. Tokens that fail are hidden on every tab (the Live feed too) and never sent to your phone. Each tab has a button to show them, marked ⚠ with the reason.</p>
  <p><b>Auto-found teams.</b> The scanner also hunts for teams by itself. Every pass it pulls the trades of young tokens (under 12 hours old, with $5K+ liquidity), on every chain, and records every wallet buying $50 or more. A day later it checks whether each token went 2x or more above that wallet's entry, and reached at least $100K. Wallets that keep hitting (3+ hits at 50%+) become "Auto-found crews", together with any wallets that bought in the same seconds as them on two or more of those tokens. They are watched like any other team. Ones with 4+ hits at 60%+ can drive buy signals and ⚡ alerts.</p>
  <p><b>⚡ Team buy alerts.</b> A separate fast watcher checks the proven teams' wallets about every 20 seconds and pushes an alert for any buy of $50 or more on a token under a week old. Each alert says how many seconds after the buy it was seen. Tokens that can't be sold are skipped, and risky ones are marked ⚠.</p>
  <p><b>KOLs tab.</b> Grades public KOLs on one question: would copying their buys have made you money? Follow: copying them 5 minutes late made money on average and won at least about a third of the time. Watch: break-even or mixed. Don't follow: copying them lost money. Exit liquidity: they usually sell before you could get in, so their followers are who they sell to. Avoid (dump ring): wallets were caught selling into their buyers. KOL wallets never trigger buy signals on their own.</p>
  <p><b>Follow score.</b> The team grade comes from the research: how often a team was early on tokens that later ran. Our backtest of 676 team buys over 3 days found that grade does not tell you whether copying the team makes money. Teams that are always early include the ones that dump on their followers. So every team also gets a live <b>Follow</b> score: the median change in market cap since each of its buys in the last 3 days. A buy signal now needs at least one proven team whose Follow score is zero or better over 5+ buys.</p>
  <p><b>Dump rings (the Cupsey pattern).</b> Some wallets buy a token before a KOL calls it, or are sent tokens by the deployer, then sell into the followers the moment the KOL buys. Teams caught doing this are marked ⚠ on the Teams tab and never trigger buy signals. This is checked live: a team that sells tokens it never bought gets flagged automatically. Known KOL dump-ring wallets (Cupsey's side wallets and others we found) are watched too. Any token they touch, or that insiders dump without ever buying, is marked ⚠ and blocked from signals.</p>
  <p><b>No spam.</b> Small test buys and buys by unproven teams are left out by default everywhere: the Live feed shows proven-team buys of $${FEED_MIN}+ only, and Hot now only shows a token if a proven team put in $${HOT_MIN}+ in the last 6 hours or 2+ proven teams are in. Each has a button to show everything.</p>
  <p><b>Phone alerts.</b> Install the free <b>ntfy</b> app and subscribe to the topic <span class="mono">${esc(NTFY_TOPIC)}</span> (or open <a href="${esc(NTFY_URL)}" target="_blank" rel="noopener">${esc(NTFY_URL)}</a>). You get a notification for each new buy signal.</p>
  <p><b>It is not instant.</b> The scanner runs about every 6 to 7 minutes, so a signal or phone alert usually lands a few minutes after the buy happened, sometimes up to ~10 minutes. The Live feed shows "seen Xm after the trade" so you can see the delay. Fast tokens can move a lot in that time.</p>
  <p><b>What a "team" is.</b> A set of wallets we linked together from past launches: same funder, buying in the same second or minute, or repeatedly early on the same winners. Solo wallets that keep being early are included too.</p>
  <p><b>Team names.</b> Each team gets a fixed nickname (like "Zinc Bees") so you can follow it across the page, plus a style:</p>
  <p>· <b>Same-second snipers</b>: wallets that buy in the same second, so one person or bot runs them.<br>· <b>Same-minute crew</b>: wallets that keep hitting the same new tokens within a minute.<br>· <b>One-funder crew</b>: wallets funded by the same source wallet.<br>· <b>Wallet farm</b>: many fresh wallets from one funder, made to look like different buyers.<br>· <b>Launch team</b>: wallets tied to the token creator.<br>· <b>Insider team / Linked cluster</b>: wallets linked by repeated early co-buys.<br>· <b>Solo insider / Smart early buyer</b>: one wallet with a strong early-entry record.</p>
  <p><b>Grades</b> come from the track record we measured before watching: <span class="tag g-Elite">Elite</span> 10+ winners and 75%+ hit rate · <span class="tag g-Strong">Strong</span> 5+ winners and 60%+ · <span class="tag g-Tested">Tested</span> wallets from our copy-trading test · <span class="tag g-Decent">Decent</span> 3+ winners · <span class="tag">Unproven</span> fewer. Elite, Strong, Tested and ★ teams count as <b>proven</b>.</p>
  <p><b>★ Lasting-token pickers.</b> Teams marked ★ were early on tokens that held their value for weeks (like PRIORS on Robinhood) in our 80-day study, not just quick pumps. They count as proven and their buys count extra in Hot now.</p>
  <p><b>Token status.</b> <span class="tag up">Fresh</span> launched in the last 24h · <span class="tag up">Running</span> price up 10%+ in 1h or 25%+ in 6h · <span class="tag down">Fading</span> down 35%+ in 6h, 60%+ in 24h, or 60%+ below the highest market cap we saw · <span class="tag">Young</span> 1 to 3 days old, steady · <span class="tag faint">Older</span> everything else. Fading tokens and tokens older than 3 days are hidden by default.</p>
  <p><b>Buys only.</b> The page shows what teams are buying. Sells are left out because by the time a team sells, it is usually too late to act.</p>
  <p><b>Hot now</b> ranks tokens by how many separate teams and wallets bought in the last 6 hours, and how much they spent. <b>Best last 7 days</b> compares market cap now with market cap at the first team buy. <b>Alerts</b> is the older, looser alert (any 2 wallets of a team or 2 teams, any size).</p>
  <p><b>Be careful.</b> When we tested copying these teams, most of the profit was gone by the time a copier could get in, and fees ate the rest. Teams also sell fast. Use this to find tokens worth a look, then do your own checks.</p>
  <p class="faint">Data: public blockchain nodes and GeckoTerminal, scanned every 6 to 7 minutes by a free GitHub Action. This page reloads the data every 2 minutes. Nothing here is financial advice.</p></div>`;
}

/* ---------- events ---------- */
function setView(v){if(!VIEWS.includes(v))v='signals';view=v;try{history.replaceState(null,'',v==='signals'?location.pathname+location.search:'#'+v)}catch(e){}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.v){setView(d.v);render()}
  else if(d.c){chain=d.c;kpis();render()}
  else if(d.b){bestMode=d.b;render()}
  else if(d.a){age=d.a;render()}
  else if(d.x){fading=!fading;render()}
  else if(d.sf){sigFading=!sigFading;render()}
  else if(d.f){feedAll=d.f==='all';render()}
  else if(d.s){hotSmall=!hotSmall;render()}
  else if(d.n){newAll=d.n==='all';render()}
  else if(d.r){showRisky=!showRisky;render()}
  else if(d.k){kolG=d.k;render()}});
let qT=0;$('#q').addEventListener('input',e=>{clearTimeout(qT);const v=e.target.value.trim().toLowerCase();qT=setTimeout(()=>{if(v!==q){q=v;render()}},120)});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS.includes(v)&&v!==view){view=v;render()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastLoad>110000)load()});
{const v=location.hash.slice(1);if(VIEWS.includes(v))view=v}
render();load();
setInterval(()=>{if(!document.hidden)load()},120000);
setInterval(()=>{if(lastLoad)stamp()},30000);
