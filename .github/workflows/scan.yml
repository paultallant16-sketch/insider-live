name: scan
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan all chains on a loop (about 5.5 hours per job)
        env:
          RUN_BUDGET: '400'
          NTFY_TOPIC: 'insider-live-49ab55a62a52'
        run: |
          git config user.name  "insider-live-bot"
          git config user.email "actions@users.noreply.github.com"
          end=$(( $(date +%s) + 5*3600 + 1800 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            python scanner/scan.py || true
            git add -- data docs/data ':(exclude)*.tmp'
            if ! git diff --cached --quiet; then
              git commit -m "scan $(date -u +'%Y-%m-%d %H:%M')" -q
              for i in 1 2 3; do (git pull --rebase -q -X theirs || { git rebase --abort; false; }) && git push -q && break; sleep 5; done
            fi
            sleep 15
          done
